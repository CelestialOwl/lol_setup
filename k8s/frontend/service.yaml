apiVersion: v1
kind: Service
metadata:
  name: lol-frontend
  namespace: lol-tracker
  labels:
    app: lol-frontend
spec:
  selector:
    app: lol-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lol-frontend-ingress
  namespace: lol-tracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: lol-tracker.example.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lol-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lol-backend
                port:
                  number: 80
