apiVersion: apps/v1
kind: Deployment
metadata:
  name: lol-frontend
  namespace: lol-tracker
  labels:
    app: lol-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lol-frontend
  template:
    metadata:
      labels:
        app: lol-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: lol-frontend
          image: ghcr.io/celestialowl/lol-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js writes to .next/ at runtime
            capabilities:
              drop:
                - ALL
