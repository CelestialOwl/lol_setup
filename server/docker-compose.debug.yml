# Debug override — use alongside the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
#
# This replaces the api service with a debug build that:
#   - Uses Dockerfile.debug (Delve + no compiler optimisations)
#   - Exposes port 2345 for VS Code to attach
#   - Runs Delve in headless mode (app won't start until VS Code connects)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.debug
    cap_add:
      - SYS_PTRACE
    ports:
      - "8080:8080"
      - "2345:2345"
    security_opt:
      - seccomp:unconfined
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=lol_tracker
      - REDIS_URL=redis:6379
      - RIOT_API_KEY=${RIOT_API_KEY}
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
