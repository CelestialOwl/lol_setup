version: "2"

linters:
  default: none
  enable:
    - errcheck       # unhandled errors
    - govet          # suspicious constructs (go vet)
    - staticcheck    # staticcheck SA/S/ST rules
    - ineffassign    # assignments that are never read
    - gocritic       # opinionated but useful style checks
    - gosimple       # simplify code
    - unused         # unused code
  settings:
    govet:
      enable-all: true
      disable:
        - shadow       # too noisy during initial adoption
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam
    errcheck:
      # Allow common "unrecoverable" write errors to be ignored via //nolint:errcheck
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclusions:
    rules:
      # Test files: relax errcheck and unused rules
      - path: "_test\\.go"
        linters:
          - errcheck
      # Generated / vendor paths
      - path: "vendor/"
        linters:
          - all
